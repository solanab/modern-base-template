name: check
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - name: Create source-lines token
        id: source_lines_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_LINES_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_LINES_APP_PRIVATE_KEY }}
          owner: solanab
          repositories: source-lines
          permission-contents: read
      - name: Install repository tools
        env:
          GH_TOKEN: ${{ steps.source_lines_token.outputs.token }}
        run: just install
      - name: Check
        run: just check
      - name: Run Prek hooks
        if: runner.os == 'Linux'
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          # Must be >= prek.toml minimum_prek_version.
          prek-version: "0.4.14"
